name: case

# One game per run. Weekly cron supplies the batching, spread across weeks, so
# running out of quota can never cost more than the single game in flight.
on:
  schedule:
    # 21:00 UTC Saturday = 00:00 Athens Sunday in summer, 23:00 Athens Saturday
    # in winter. Either way the whole night sits inside the guard's window.
    - cron: '0 21 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      # GitHub delays scheduled runs under load, sometimes by five hours. The
      # game may start any time overnight; a daytime start would spend a
      # five-hour quota window Nick is trying to use. Testing for daytime rather
      # than for a night window keeps this correct across the DST change, when
      # the same cron lands at 23:00 Athens instead of 00:00. A skip is pushed,
      # so a silent week means the run never started at all. Manual runs skip
      # the guard.
      - id: guard
        if: github.event_name == 'schedule'
        run: |
          hour=$(TZ=Europe/Athens date +%-H)
          echo "Athens hour: $hour"
          if [ "$hour" -ge 7 ] && [ "$hour" -lt 22 ]; then
            echo "Started at ${hour}:00 Athens — past the cutoff, skipping this week."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            curl -H "Title: Mafia: week skipped" -H "Tags: mafia" \
                 -H "Priority: low" -H "Click: $RUN_URL" \
                 -d "GitHub started the run at ${hour}:00 Athens, past the 07:00 cutoff. No game this week." \
                 "https://ntfy.sh/$NTFY_TOPIC"
            [ -n "$DISCORD_WEBHOOK" ] && curl -s -H "Content-Type: application/json" \
                 -d "{\"content\": \"🎭 **Mafia**: week skipped (started at ${hour}:00 Athens, past cutoff)\"}" \
                 "$DISCORD_WEBHOOK"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Three mafia is the config the trusted-person buff is being measured on.
      - name: Play one game
        if: steps.guard.outputs.skip != 'true'
        run: python tools/run_batch.py --games 1 --no-wait --mafia 3

      - name: Review, publish, PR, merge
        if: steps.guard.outputs.skip != 'true'
        run: python tools/ci_case.py "$(ls -t runs/*.json | head -1)"

      - name: Upload the log
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-log
          path: runs/
          if-no-files-found: ignore

      - name: Notify on success
        if: success() && steps.guard.outputs.skip != 'true'
        run: |
          curl -H "Title: Mafia: new case" -H "Tags: mafia" \
               -H "Click: $RUN_URL" -d "Game finished and published. $RUN_URL" \
               "https://ntfy.sh/$NTFY_TOPIC"
          [ -n "$DISCORD_WEBHOOK" ] && curl -s -H "Content-Type: application/json" \
               -d "{\"content\": \"🎭 **Mafia**: new case published — <$RUN_URL>\"}" \
               "$DISCORD_WEBHOOK"

      - name: Notify on failure
        if: failure()
        run: |
          curl -H "Title: Mafia: run failed" -H "Tags: mafia" \
               -H "Click: $RUN_URL" -d "The game did not finish. $RUN_URL" \
               "https://ntfy.sh/$NTFY_TOPIC"
          [ -n "$DISCORD_WEBHOOK" ] && curl -s -H "Content-Type: application/json" \
               -d "{\"content\": \"⚠️ **Mafia**: run failed — <$RUN_URL>\"}" \
               "$DISCORD_WEBHOOK"
