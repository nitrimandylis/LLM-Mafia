name: test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # ponytail: the test_*.py files are __main__ scripts, not pytest cases
      - run: for f in tools/test_*.py; do echo "== $f"; python "$f" || exit 1; done
